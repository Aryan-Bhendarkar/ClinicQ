# ArgoCD only marks an Ingress Healthy once it has a load balancer address. This account
# cannot create load balancers, so treat an Ingress as healthy once it exists.
#   kubectl patch configmap argocd-cm -n argocd --type merge --patch-file argocd/ingress-health.yaml
data:
  resource.customizations.health.networking.k8s.io_Ingress: |
    hs = {}
    hs.status = "Healthy"
    hs.message = "Ingress configured; reached through the ingress controller"
    return hs
