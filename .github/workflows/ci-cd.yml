name: ClinicQ CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  # GHCR requires lowercase image names
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/clinicq

permissions:
  contents: read

jobs:
  test:
    name: Test and build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Run pytest (quality gate - failure stops the pipeline)
        run: pytest -v
        working-directory: backend

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: npm ci && npm run build
        working-directory: frontend

  build-scan-push:
    name: Build, Trivy scan, push to GHCR
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image prefix
        run: echo "IMAGE_PREFIX=${IMAGE_PREFIX,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: ${{ env.IMAGE_PREFIX }}-backend:${{ env.TAG }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: ${{ env.IMAGE_PREFIX }}-frontend:${{ env.TAG }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Trivy scan - backend (fails on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-backend:${{ env.TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Trivy scan - frontend (fails on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-frontend:${{ env.TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images (only after tests and scans pass)
        if: github.event_name == 'push'
        run: |
          docker push ${IMAGE_PREFIX}-backend:${TAG}
          docker push ${IMAGE_PREFIX}-frontend:${TAG}

  deploy:
    name: Deploy to EKS with Helm
    needs: build-scan-push
    # Runs only on main pushes and only when the cluster kubeconfig secret exists.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Configure kubectl
        if: env.KUBE_CONFIG_DATA != ''
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Helm upgrade --install
        if: env.KUBE_CONFIG_DATA != ''
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          helm upgrade --install clinicq ./helm/clinicq \
            --namespace clinicq --create-namespace \
            -f helm/clinicq/values-prod.yaml \
            --set backend.image=ghcr.io/${OWNER}/clinicq-backend \
            --set frontend.image=ghcr.io/${OWNER}/clinicq-frontend \
            --set backend.tag=${{ github.sha }} \
            --set frontend.tag=${{ github.sha }} \
            ${DB_PASSWORD:+--set postgres.password="$DB_PASSWORD"} \
            --wait --timeout 5m

      - name: Skip notice
        if: env.KUBE_CONFIG_DATA == ''
        run: echo "KUBE_CONFIG_DATA secret not set - skipping deploy (cluster not provisioned)."
