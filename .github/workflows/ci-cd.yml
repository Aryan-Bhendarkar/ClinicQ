name: ClinicQ CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  # GHCR requires lowercase image names
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/clinicq

permissions:
  contents: read

jobs:
  test:
    name: Test and build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Run pytest (quality gate - failure stops the pipeline)
        run: pytest -v
        working-directory: backend

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: npm ci && npm run build
        working-directory: frontend

  build-scan-push:
    name: Build, Trivy scan, push to GHCR
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image prefix
        run: echo "IMAGE_PREFIX=${IMAGE_PREFIX,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: ${{ env.IMAGE_PREFIX }}-backend:${{ env.TAG }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: ${{ env.IMAGE_PREFIX }}-frontend:${{ env.TAG }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Trivy scan - backend (fails on HIGH/CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            ${IMAGE_PREFIX}-backend:${TAG}

      - name: Trivy scan - frontend (fails on HIGH/CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            ${IMAGE_PREFIX}-frontend:${TAG}

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images (only after tests and scans pass)
        if: github.event_name == 'push'
        run: |
          docker push ${IMAGE_PREFIX}-backend:${TAG}
          docker push ${IMAGE_PREFIX}-frontend:${TAG}

  update-gitops:
    name: Update image tags for ArgoCD (GitOps)
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Point values-prod.yaml at the new image tag
        run: |
          sed -i '/^backend:/,/^frontend:/ s|^  tag: .*|  tag: ${{ github.sha }}|' helm/clinicq/values-prod.yaml
          sed -i '/^frontend:/,/^postgres:/ s|^  tag: .*|  tag: ${{ github.sha }}|' helm/clinicq/values-prod.yaml
          git diff --stat

      - name: Commit the new tag (ArgoCD syncs from this commit)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then echo "Tags already up to date"; exit 0; fi
          git add helm/clinicq/values-prod.yaml
          git commit -m "Deploy image tag ${GITHUB_SHA::7}"
          git pull --rebase origin main
          git push origin HEAD:main
