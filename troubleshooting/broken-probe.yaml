# LAB 3 - CrashLoopBackOff / unready pod from a bad readiness probe
#   kubectl apply -f troubleshooting/broken-probe.yaml
#   kubectl get pods -n clinicq-lab -l app=broken-probe      -> 0/1 Running, never Ready
#   kubectl describe pod -n clinicq-lab -l app=broken-probe  -> "Readiness probe failed: 404"
# Root cause: probe path /ready does not exist on nginx. Fix: use path /.
#   kubectl patch deployment broken-probe -n clinicq-lab --type=json \
#     -p='[{"op":"replace","path":"/spec/template/spec/containers/0/readinessProbe/httpGet/path","value":"/"}]'
apiVersion: v1
kind: Namespace
metadata:
  name: clinicq-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-probe
  namespace: clinicq-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broken-probe
  template:
    metadata:
      labels:
        app: broken-probe
    spec:
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 5
