# LAB 2 - Service with no endpoints (label mismatch)
#   kubectl apply -f troubleshooting/broken-service.yaml
#   kubectl get pods -n clinicq-lab --show-labels      -> pods are Running, label app=web-ok
#   kubectl get svc,endpoints -n clinicq-lab           -> endpoints <none>
#   kubectl describe svc web -n clinicq-lab            -> Selector: app=web-wrong
# Root cause: Service selector does not match the Pod labels. Fix:
#   kubectl patch svc web -n clinicq-lab -p '{"spec":{"selector":{"app":"web-ok"}}}'
apiVersion: v1
kind: Namespace
metadata:
  name: clinicq-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: clinicq-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-ok
  template:
    metadata:
      labels:
        app: web-ok
    spec:
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: clinicq-lab
spec:
  selector:
    app: web-wrong
  ports:
    - port: 80
      targetPort: 8080
