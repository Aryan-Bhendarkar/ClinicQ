{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "clinicq.fullname" . }}-backend
  labels:
    release: {{ .Values.monitoring.serviceMonitor.releaseLabel }}
    {{- include "clinicq.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: clinicq-backend
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
{{- end }}
