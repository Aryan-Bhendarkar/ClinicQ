apiVersion: v1
kind: Service
metadata:
  name: {{ include "clinicq.fullname" . }}-frontend
  labels:
    app: clinicq-frontend
    {{- include "clinicq.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: clinicq-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "clinicq.fullname" . }}-frontend
  labels:
    {{- include "clinicq.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: clinicq-frontend
  template:
    metadata:
      labels:
        app: clinicq-frontend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image }}:{{ .Values.frontend.tag }}"
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          env:
            - name: BACKEND_URL
              value: "http://{{ include "clinicq.fullname" . }}-backend:{{ .Values.backend.port }}"
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources.frontend | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
            capabilities: {drop: ["ALL"]}
