# helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#   -n monitoring --create-namespace -f monitoring/prometheus-values.yaml
grafana:
  enabled: true
  adminPassword: admin-change-me   # demo only; set via --set grafana.adminPassword=... for real use
  service:
    type: ClusterIP
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
prometheus:
  prometheusSpec:
    # Discover ServiceMonitors from every namespace, not just ones labelled for this release.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    serviceMonitorSelector: {}
    retention: 24h
    resources:
      requests: {cpu: 200m, memory: 512Mi}
alertmanager:
  enabled: false
